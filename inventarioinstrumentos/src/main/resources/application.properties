spring.application.name=inventarioinstrumentos

# ---------------------------------------------------------
# Base de datos MySQL (XAMPP)
# createDatabaseIfNotExist=true crea la base de datos sola
# la primera vez que arranca el proyecto, no hace falta
# crearla a mano en phpMyAdmin.
# Si tu usuario/contraseña de MySQL son distintos, cambialos aqui.
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_instrumentos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/La_Paz
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update crea/actualiza las tablas automaticamente
# a partir de las clases @Entity (Instrumento, Cliente, etc.)
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
